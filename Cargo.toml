[workspace]
resolver = "3"
members = ["crates/graticule", "demo"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jwric/graticule"

[workspace.dependencies]
graticule = { path = "crates/graticule" }

# The pixel-scale iced fork: the interface is laid out in virtual pixels and
# upscaled nearest-neighbour, and `crisp` snaps quads, text and one-pixel
# strokes to the grid. Switch to the path patch below when working on the fork
# itself.
[workspace.dependencies.iced]
git = "https://github.com/jwric/iced"
branch = "0.14-pixel-scale"
default-features = false

[workspace.dependencies.iced_widget]
git = "https://github.com/jwric/iced"
branch = "0.14-pixel-scale"

[workspace.dependencies.iced_test]
git = "https://github.com/jwric/iced"
branch = "0.14-pixel-scale"

# To work on the fork itself, point these at a local checkout:
# [patch.'https://github.com/jwric/iced']
# iced = { path = "../iced" }
# iced_widget = { path = "../iced/widget" }
# iced_test = { path = "../iced/test" }

[profile.release]
opt-level = 3
lto = "thin"

[profile.release-web]
inherits = "release"
opt-level = "s"
