[package]
name = "quadrille-demo"
version = "0.1.0"
description = "The quadrille showcase: an instrument console drawn with the toolkit."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# cdylib for the browser bundle; rlib so the binary and tests link normally.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "quadrille-demo"
path = "src/main.rs"

[dependencies]
quadrille.workspace = true
# The browser build gets this set: wgpu on WebGL2 only.
iced = { workspace = true, features = ["wgpu-bare", "webgl", "canvas", "advanced", "crisp", "image-without-codecs"] }
web-time = "1"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
# Native builds restore iced's usual renderers and platforms, with tiny-skia as
# the fallback.
iced = { workspace = true, features = ["wgpu", "tiny-skia", "smol", "x11", "wayland"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "Window"] }

[dev-dependencies]
iced_test.workspace = true
