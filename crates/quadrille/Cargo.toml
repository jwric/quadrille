[package]
name = "quadrille"
version = "0.1.0"
description = "Pixel-perfect type, drawing and widgets for iced: interfaces laid out in whole pixels."
keywords = ["iced", "gui", "pixel-art", "retro", "pixel-font"]
categories = ["gui"]
edition.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**", "fonts/**", "README.md"]

[dependencies]
# The widget layer alone: renderers, windowing and executors are the
# application's choice. `image` is for rasters built from RGBA.
iced_widget = { workspace = true, features = ["advanced", "canvas", "image"] }
iced_core = { workspace = true, features = ["crisp"] }

[dev-dependencies]
iced = { workspace = true, features = ["tiny-skia", "thread-pool", "x11", "wayland"] }
iced_test.workspace = true
# Reads a snapshot's pixels back: iced_test compares snapshots with files but
# never hands their pixels out. The version iced_test decodes with.
png = "0.18"
